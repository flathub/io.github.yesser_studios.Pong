id: io.github.yesser_studios.Pong
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet8
finish-args:
  - --device=all
    # - --socket=wayland
  - --socket=x11
  - --share=ipc
  - --filesystem=xdg-run/app/com.discordapp.Discord:create
  - --filesystem=xdg-run/app/com.discordapp.DiscordCanary:create

command: run.sh
modules:
  - name: dotnet
    buildsystem: simple
    build-commands:
      - if [ $(uname -m) = "aarch64" ]; then /usr/lib/sdk/dotnet8/bin/install.sh; fi

  - name: pong
    buildsystem: simple
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/bin
      - if [ $(uname -m) = "aarch64" ]; then cp -r ./bin/universal/release/* ${FLATPAK_DEST}/bin/; else cp -r ./bin/x64/release/* ${FLATPAK_DEST}/bin/; fi
      - install -Dm644 flatpak/io.github.yesser_studios.Pong.desktop -t ${FLATPAK_DEST}/share/applications/
      - install -Dm644 flatpak/io.github.yesser_studios.Pong.svg -t ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps
      - install -Dm644 flatpak/io.github.yesser_studios.Pong.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
      - install -Dm755 ./run.sh -t ${FLATPAK_DEST}/bin/
    sources:
      - type: git
        url: https://github.com/yesser-studios/Pong.git
        tag: v1.3.0-alpha.2.1
      - type: archive
        url: https://github.com/yesser-studios/Pong/releases/download/v1.3.0-alpha.2/linux-universal.tar.gz
        sha256: 0e4f7331d0b7f2317207043624171fe7edd62215dac0108b6dafeb4e92c08f28
        dest-filename: build.tar.gz
        dest: bin/universal/
      - type: archive
        url: https://github.com/yesser-studios/Pong/releases/download/v1.3.0-alpha.2/linux-x64.tar.gz
        sha256: a570f12b493da796bd98f56306d195c3460517a5d50506bdc66b83835d6112b9
        dest-filename: build.tar.gz
        dest: bin/x64/
        strip-components: 1
      - type: script
        dest-filename: run.sh
        commands:
          - if [ $(uname -m) = "aarch64" ]; then exec dotnet /app/bin/Pong.Desktop.dll; else exec /app/bin/Pong.Desktop; fi

